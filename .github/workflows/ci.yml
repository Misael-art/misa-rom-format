name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov black

    - name: Lint with black
      run: black --check .

    - name: Run tests with coverage
      id: test
      run: pytest --cov --fail-under=90 -k "golden" --tb=short tests/

    - name: Generate badge
      if: always()
      run: |
        if [ ${{ steps.test.outcome }} == 'success' ]; then
          echo '{"schemaVersion":1,"label":"benchmark","message":"passing","color":"brightgreen"}' > benchmarks/badge.json
        else
          echo '{"schemaVersion":1,"label":"benchmark","message":"failing","color":"red"}' > benchmarks/badge.json
        fi

    - name: Upload badge artifact
      uses: actions/upload-artifact@v4
      with:
        name: badge
        path: benchmarks/badge.json