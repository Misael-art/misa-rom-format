name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build wheel
      run: |
        python setup.py sdist bdist_wheel

    - name: Set up Rust
      if: hashFiles('Cargo.toml') != ''
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable

    - name: Cargo build --release
      if: hashFiles('Cargo.toml') != ''
      run: cargo build --release

    - name: Upload to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        twine upload dist/*.whl

  benchmarks:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: Install dependencies
      run: |
        pip install pytest pytest-json-report pandas

    - name: Run golden benchmarks
      run: |
        pytest tests/test_performance_benchmarks.py -k "golden" --json-report --json-report-file=benchmarks.json -v

    - name: Parse JSON to CSV
      run: python -c "import json\nimport pandas as pd\nwith open('benchmarks.json', 'r') as f:\n    data = json.load(f)\ndf = pd.json_normalize(data['tests'])\ndf.to_csv('benchmarks/benchmark_results.csv', index=False)"

    - name: Upload CSV artifact
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-csv
        path: benchmarks/benchmark_results.csv