name: Performance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Run every Monday at midnight

jobs:
  benchmark:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-benchmark pytest-profiling memory_profiler psutil
    
    - name: Run Performance Tests
      run: |
        pytest tests/performance --benchmark-only --benchmark-json output.json
    
    - name: Generate Performance Report
      run: |
        python scripts/generate_performance_report.py output.json > performance_report.md
    
    - name: Store Performance Results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Python Performance Benchmarks
        tool: 'pytest'
        output-file-path: output.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        alert-threshold: '150%'
        comment-on-alert: true
        fail-on-alert: true
    
    - name: Upload Performance Report
      uses: actions/upload-artifact@v4
      with:
        name: performance-report
        path: |
          performance_report.md
          output.json
          .benchmarks/
        retention-days: 90 